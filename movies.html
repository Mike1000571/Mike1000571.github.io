<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movies</title>
<style>
:root{--bg:#0a0a0b;--red:#e5232f;--border:rgba(255,255,255,.15);--muted:rgba(255,255,255,.55)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
.page{position:fixed;inset:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:18px 20px}
.search-wrap{position:relative;width:min(560px,100%);margin:0 auto}
.search-wrap svg{position:absolute;left:16px;top:50%;width:16px;height:16px;margin-top:-8px;fill:none;stroke:rgba(255,255,255,.5);stroke-width:2;stroke-linecap:round;pointer-events:none}
.search{width:100%;padding:12px 18px 12px 42px;background:#141417;border:1px solid var(--border);border-radius:999px;color:#fff;font:inherit;font-size:.9rem;outline:none}
.search:focus{border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;max-width:1400px;margin:0 auto;padding:14px 20px 40px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:.75rem;letter-spacing:2px;padding:30px}
.card{position:relative;aspect-ratio:1.6;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:linear-gradient(135deg,#141417,#1f1f25);contain:layout paint style;transition:border-color .2s,transform .18s}
.card:hover{border-color:rgba(255,255,255,.35);transform:translateY(-2px)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s,filter .2s}
.card img.on{opacity:1}
.card:hover img{filter:brightness(.55)}
.card-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),transparent 55%)}
.card-title{position:absolute;left:12px;right:12px;bottom:10px;font-size:.85rem;font-weight:600;line-height:1.25;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.play{position:absolute;top:50%;left:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s}
.card:hover .play{opacity:1;transform:scale(1)}
.play svg{width:26px;height:26px;fill:#fff;margin-left:3px}
.player{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
.player.open{display:flex}
.pl-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;background:#111114;border-bottom:1px solid rgba(255,255,255,.1)}
.pl-title{font-size:.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-close{width:38px;height:38px;flex-shrink:0;border-radius:10px;background:#1a1a1e;border:1px solid rgba(255,255,255,.12);color:#fff;font-size:1.1rem;cursor:pointer}
.pl-close:hover{border-color:var(--red)}
.stage{position:relative;flex:1;min-height:0;background:#000}
.stage iframe,.stage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);font-size:.95rem;line-height:1.5}
.msg.show{display:flex}
.embedded .pl-bar{display:none}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.top{padding:12px}.grid{grid-template-columns:repeat(2,1fr);padding:10px 12px 30px}}
</style>
</head>
<body>
<div class="page" id="page">
<header class="top"><div class="search-wrap">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
<input class="search" id="search" type="text" placeholder="Search movies..." autocomplete="off" spellcheck="false">
</div></header>
<div class="grid" id="grid"></div>
</div>
<div class="player" id="player">
<div class="pl-bar"><div class="pl-title" id="pl-title"></div><button class="pl-close" id="pl-close" aria-label="Close">✕</button></div>
<div class="stage" id="stage"><div class="msg" id="msg"></div></div>
</div>
<script>
/*
  EDIT THIS PART.
  MOVIE_DIR / POSTER_DIR: '' means the files are in the main folder of the repo.
  Use 'movies/' or 'images/' if you uploaded them inside those folders.
  file: an .html page (shows in a frame) OR a video file like .mp4 / .webm (plays in a video player).
  poster: optional picture name.
*/
const MOVIE_DIR = '', POSTER_DIR = '';
const MOVIES = [
  { title: "Spider Man Brand New Day", file: "Spider Man Brand New Day.html", poster: "brand new day.png" },
  { title: "Obsession", file: "Obsession.html", poster: "obsession.png" },
  { title: "Street Fighter", file: "Street Fighter.html", poster: "Street Fighter.png" },
];

if (window.top !== window.self) document.body.classList.add('embedded');
const $ = id => document.getElementById(id);
const grid = $('grid'), stage = $('stage'), player = $('player'), msg = $('msg');
const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const enc = p => p.split('/').map(encodeURIComponent).join('/');

/* posters only exist while near the screen */
function mountPoster(c){
  if (c._im || !c._poster) return;
  const im = new Image(); im.alt = ''; im.decoding = 'async';
  im.onload = () => im.classList.add('on');
  im.onerror = () => { im.remove(); c._im = null; };
  im.src = POSTER_DIR + enc(c._poster);
  c.insertBefore(im, c.firstChild); c._im = im;
}
function unmountPoster(c){
  if (!c._im) return;
  c._im.onload = c._im.onerror = null; c._im.removeAttribute('src'); c._im.remove(); c._im = null;
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? mountPoster(e.target) : unmountPoster(e.target)), { root: $('page'), rootMargin: '400px 0px' }) : null;

const cards = MOVIES.map(m => {
  const c = document.createElement('div');
  c.className = 'card'; c.tabIndex = 0; c.dataset.title = m.title.toLowerCase(); c._poster = m.poster;
  c.innerHTML = '<div class="card-shade"></div><div class="play">' + PLAY + '</div><div class="card-title"></div>';
  c.querySelector('.card-title').textContent = m.title;
  c.onclick = () => openMovie(m);
  c.onkeydown = e => { if (e.key === 'Enter') openMovie(m); };
  grid.appendChild(c); io ? io.observe(c) : mountPoster(c);
  return c;
});
const emptyMsg = document.createElement('div');
emptyMsg.className = 'empty'; emptyMsg.textContent = 'NO MOVIES FOUND'; emptyMsg.style.display = 'none';
grid.appendChild(emptyMsg);

$('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim(); let n = 0;
  cards.forEach(c => { const ok = c.dataset.title.includes(q); c.style.display = ok ? '' : 'none'; if (ok) n++; });
  emptyMsg.style.display = n ? 'none' : 'block';
});

/* player: video files get a video player, everything else a frame */
let media = null;
function clearStage(){
  if (media) { if (media.tagName === 'VIDEO') { media.pause(); media.removeAttribute('src'); media.load(); } media.remove(); media = null; }
  msg.classList.remove('show');
}
function openMovie(m){
  clearStage();
  $('pl-title').textContent = m.title;
  const url = MOVIE_DIR + enc(m.file);
  if (/\.(mp4|webm|mov|m4v|ogv)$/i.test(m.file)) {
    media = document.createElement('video');
    media.controls = true; media.autoplay = true; media.playsInline = true; media.preload = 'metadata';
    media.onerror = () => { msg.textContent = "This video couldn't load. Check the file name and that it was uploaded (GitHub web upload allows up to 25 MB per file)."; msg.classList.add('show'); };
    media.src = url;
  } else {
    media = document.createElement('iframe');
    media.allow = 'fullscreen; autoplay'; media.allowFullscreen = true;
    media.src = url;
  }
  stage.insertBefore(media, msg);
  player.classList.add('open');
}
function closeMovie(){ clearStage(); player.classList.remove('open'); }
$('pl-close').onclick = closeMovie;
addEventListener('keydown', e => { if (e.key === 'Escape' && player.classList.contains('open')) closeMovie(); });
</script>
</body>
</html>
