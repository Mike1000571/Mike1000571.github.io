<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movies</title>
<style>
  :root { --bg:#0a0a0b; --red:#e5232f; --border:rgba(255,255,255,.15); --muted:rgba(255,255,255,.55); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg); color:#fff; font-family:'Inter',system-ui,sans-serif; overflow:hidden; }

  .page { position:fixed; inset:0; overflow-y:auto; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.15) transparent; }

  .top { position:sticky; top:0; z-index:10; background:var(--bg); padding:18px 20px; }
  .search-wrap { position:relative; width:min(560px,100%); margin:0 auto; }
  .search-wrap svg { position:absolute; left:16px; top:50%; width:16px; height:16px; margin-top:-8px; fill:none; stroke:rgba(255,255,255,.5); stroke-width:2; stroke-linecap:round; pointer-events:none; }
  .search { width:100%; padding:12px 18px 12px 42px; background:#141417; border:1px solid var(--border); border-radius:999px; color:#fff; font:inherit; font-size:.9rem; outline:none; }
  .search::placeholder { color:rgba(255,255,255,.4); }
  .search:focus { border-color:var(--red); }

  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; max-width:1400px; margin:0 auto; padding:14px 20px 40px; }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); font-family:'Space Mono',monospace; font-size:.75rem; letter-spacing:2px; padding:30px; }

  .card { position:relative; aspect-ratio:1.6; border-radius:12px; overflow:hidden; cursor:pointer; border:1px solid rgba(255,255,255,.1); background:#141417; transition:border-color .2s, transform .18s; }
  .card:hover { border-color:rgba(255,255,255,.35); transform:translateY(-2px); }
  .card-bg { position:absolute; inset:0; background:#141417 center/cover no-repeat; transition:filter .2s; }
  .card:hover .card-bg { filter:brightness(.55); }
  .card-shade { position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.75),transparent 55%); }
  .card-title { position:absolute; left:12px; right:12px; bottom:10px; font-size:.85rem; font-weight:600; line-height:1.25; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  .play { position:absolute; top:50%; left:50%; width:54px; height:54px; margin:-27px 0 0 -27px; border-radius:50%; background:var(--red); display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(.8); transition:opacity .2s, transform .2s; }
  .card:hover .play { opacity:1; transform:scale(1); }
  .play svg { width:26px; height:26px; fill:#fff; margin-left:3px; }

  .player { position:fixed; inset:0; z-index:100; background:#000; display:none; flex-direction:column; }
  .player.open { display:flex; }
  .pl-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 14px; background:#111114; border-bottom:1px solid rgba(255,255,255,.1); }
  .pl-title { font-size:.95rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-close { width:38px; height:38px; flex-shrink:0; border-radius:10px; background:#1a1a1e; border:1px solid rgba(255,255,255,.12); color:#fff; font-size:1.1rem; cursor:pointer; }
  .pl-close:hover { border-color:var(--red); }
  .player iframe { flex:1; width:100%; min-height:0; border:0; background:#000; }

  /* when this page is inside the games player, that player already has the close button */
  .embedded .pl-bar { display:none; }

  @media (max-width:1100px) { .grid { grid-template-columns:repeat(4,1fr); } }
  @media (max-width:850px) { .grid { grid-template-columns:repeat(3,1fr); } }
  @media (max-width:600px) {
    .top { padding:12px; }
    .grid { grid-template-columns:repeat(2,1fr); padding:10px 12px 30px; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="top">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input class="search" id="search" type="text" placeholder="Search movies..." autocomplete="off" spellcheck="false">
    </div>
  </header>
  <div class="grid" id="grid"></div>
</div>

<div class="player" id="player">
  <div class="pl-bar">
    <div class="pl-title" id="pl-title"></div>
    <button class="pl-close" id="pl-close" aria-label="Close">✕</button>
  </div>
  <iframe id="frame" allowfullscreen allow="fullscreen; autoplay"></iframe>
</div>

<script>
/*
  This page sits inside the "games" folder. The movies and images folders
  are one level up, so the paths start with ../

  Each movie is an HTML file in the "movies" folder. Add entries like this:
  { title: "Movie Name", file: "Movie Name.html", poster: "../images/movie-name.jpg" }
  poster is optional. Replace the two example entries with your real movies.
*/
if (window.top !== window.self) document.body.classList.add('embedded');

const MOVIE_DIR = '';
const MOVIES = [
  { title: "Spider Man Brand New Day", file: "Spider Man Brand New Day.html", poster: "brand new day.png" },
  { title: "Obsession", file: "Obsession.html", poster: "obsession.png" },
  { title: "Street Fighter", file: "Street Fighter.html", poster: "Street Fighter.png" },
];

const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const grid = document.getElementById('grid');
const searchEl = document.getElementById('search');
const player = document.getElementById('player');
const frame = document.getElementById('frame');
const plTitle = document.getElementById('pl-title');

const cards = MOVIES.map(m => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.title = m.title.toLowerCase();
  card.innerHTML = '<div class="card-bg"></div><div class="card-shade"></div><div class="play">' + PLAY + '</div><div class="card-title"></div>';
  card.querySelector('.card-title').textContent = m.title;
  if (m.poster) card.querySelector('.card-bg').style.backgroundImage = "url('" + m.poster.replace(/'/g, "\\'") + "')";
  card.onclick = () => openMovie(m);
  grid.appendChild(card);
  return card;
});

const emptyMsg = document.createElement('div');
emptyMsg.className = 'empty';
emptyMsg.textContent = 'NO MOVIES FOUND';
emptyMsg.style.display = 'none';
grid.appendChild(emptyMsg);

searchEl.addEventListener('input', () => {
  const q = searchEl.value.toLowerCase().trim();
  let shown = 0;
  cards.forEach(c => {
    const ok = c.dataset.title.includes(q);
    c.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  emptyMsg.style.display = shown ? 'none' : 'block';
});

function openMovie(m) {
  plTitle.textContent = m.title;
  frame.src = MOVIE_DIR + encodeURIComponent(m.file);
  player.classList.add('open');
}
function closeMovie() {
  player.classList.remove('open');
  frame.src = 'about:blank';
}
document.getElementById('pl-close').onclick = closeMovie;
addEventListener('keydown', e => { if (e.key === 'Escape' && player.classList.contains('open')) closeMovie(); });
</script>
</body>
</html>
