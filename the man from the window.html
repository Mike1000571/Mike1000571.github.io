    <script>let max=0;let done=0;function mergeFiles(fileParts){return new Promise((resolve,reject)=>{let buffers=[];function fetchPart(index){if(index>=fileParts.length){let mergedBlob=new Blob(buffers);let mergedFileUrl=URL.createObjectURL(mergedBlob);resolve(mergedFileUrl);return}fetch(fileParts[index]).then(response=>response.arrayBuffer()).then(data=>{buffers.push(data);done=done+1;document.querySelector("#loading-text").textContent=`LOADING... (${done}/${max})`;fetchPart(index+1)}).catch(reject)}fetchPart(0)})}function getParts(file,start,end){let parts=[];for(let i=start;i<=end;i++){parts.push(file+".part"+i)}max=max+end;return parts}function resizeUnityContainer(){var container=document.getElementById("unityContainer");container.style.width=window.innerWidth+"px";container.style.height=window.innerHeight+"px"}Promise.all([mergeFiles(getParts("Build/build.data",1,3)),mergeFiles(getParts("Build/build.wasm",1,2))]).then(([dataUrl,wasmurl])=>{const canvas=document.querySelector("#unity-canvas");const loadingtext=document.querySelector("#loading-text");createUnityInstance(canvas,{dataUrl:dataUrl,frameworkUrl:"Build/build.framework.js",codeUrl:wasmurl,streamingAssetsUrl:"StreamingAssets",companyName:"Zed_Technician",productName:"TheManFromTheWindow",productVersion:"0.9921",matchWebGLToCanvasSize:true},progess=>{if(progess>=1){loadingtext.remove();canvas.style.display="block"}});function resizeCanvas(){canvas.height=window.innerHeight;canvas.width=window.innerWidth;setTimeout(resizeCanvas,1e3)}resizeCanvas()});</script>
